{% extends "layout.html" %}
{% block title %}Profile Settings{% endblock %}

{% block content %}
<!-- Error/Success Alerts -->
<div 
  id="errorAlert" 
  class="hidden bg-red-100 border border-red-500 text-red-800 
         px-4 py-3 rounded-md mb-4 transition-all duration-300"
>
  <div class="flex items-center">
    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
    </svg>
    <span id="errorMessage" class="block sm:inline"></span>
  </div>
</div>
<div 
  id="successAlert" 
  class="hidden bg-green-100 border border-green-500 text-green-800 
         px-4 py-3 rounded-md mb-4 transition-all duration-300"
>
  <div class="flex items-center">
    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
    </svg>
    <span id="successMessage" class="block sm:inline"></span>
  </div>
</div>

  <div class="max-w-3xl mx-auto space-y-6">
  <!-- Page Header -->
  <div class="bg-white shadow-lg rounded-lg p-6 border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-800 flex items-center">
      <svg class="w-6 h-6 mr-2 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
      Profile Settings
    </h1>
    <p class="text-gray-600 mt-2">Manage your profile information and account settings</p>
  </div>

  <!-- Profile Picture Section -->
  <div 
    class="bg-white shadow-lg rounded-lg p-6 
           transition-all duration-300 hover:shadow-xl border border-gray-100"
  >
    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center">
      <svg class="w-5 h-5 mr-2 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      Profile Picture
    </h2>
    <div class="flex items-center space-x-6">
      <div class="relative">
        <img 
          id="profilePictureDisplay" 
          src="/static/uploads/profile_pictures/default-avatar.png" 
          alt="Profile Picture"
          class="w-32 h-32 rounded-full object-cover border-4 border-gray-200 shadow-md"
          onerror="this.onerror=null; this.src='/static/uploads/profile_pictures/default-avatar.png'"
        />
        <div id="profilePictureLoading" class="hidden absolute inset-0 bg-gray-200 bg-opacity-75 rounded-full flex items-center justify-center">
          <svg class="animate-spin h-8 w-8 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      </div>
      <div class="flex-1">
        <div class="flex flex-col sm:flex-row gap-3">
          <label 
            for="profilePictureInput" 
            class="cursor-pointer bg-blue-700 text-white px-4 py-2 rounded-md 
                   hover:bg-blue-800 transition-colors duration-200
                   focus:outline-none focus:ring-2 focus:ring-offset-2 
                   focus:ring-blue-500 font-medium flex items-center justify-center"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            Upload Picture
          </label>
          <input 
            type="file" 
            id="profilePictureInput" 
            accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
            class="hidden"
          />
          <button 
            id="deleteProfilePictureBtn"
            class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md 
                   hover:bg-gray-300 transition-colors duration-200
                   focus:outline-none focus:ring-2 focus:ring-offset-2 
                   focus:ring-gray-500 font-medium flex items-center justify-center hidden"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
            Remove Picture
          </button>
        </div>
        <p class="text-sm text-gray-500 mt-2">
          Supported formats: JPEG, PNG, GIF, WebP (max 5MB)
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Check if user is logged in
  const token = localStorage.getItem('access_token');
  if (!token) {
    window.location.href = '/login';
    return;
  }

  // Display welcome message in layout nav
  const username = localStorage.getItem('username') || "User";
  const layoutWelcome = document.getElementById('layoutUserWelcome');
  if (layoutWelcome) layoutWelcome.textContent = `Welcome, ${username}!`;

  // Alert helper functions
  function showError(msg) {
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    errorMessage.textContent = msg;
    errorAlert.classList.remove('hidden');
    
    // Auto hide after 5 seconds
    setTimeout(() => {
      errorAlert.classList.add('opacity-0');
      setTimeout(() => {
        errorAlert.classList.add('hidden');
        errorAlert.classList.remove('opacity-0');
      }, 300);
    }, 5000);
    
    // Scroll to the error message if not visible
    errorAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  
  function showSuccess(msg) {
    const successAlert = document.getElementById('successAlert');
    const successMessage = document.getElementById('successMessage');
    successMessage.textContent = msg;
    successAlert.classList.remove('hidden');
    
    // Auto hide after 5 seconds
    setTimeout(() => {
      successAlert.classList.add('opacity-0');
      setTimeout(() => {
        successAlert.classList.add('hidden');
        successAlert.classList.remove('opacity-0');
      }, 300);
    }, 5000);
    
    // Scroll to the success message if not visible
    successAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Load user profile and populate form
  async function loadUserProfile() {
    try {
      const response = await fetch('/users/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      if (!response.ok) {
        if (response.status === 401) {
          localStorage.clear();
          window.location.href = '/login';
          return;
        }
        throw new Error('Failed to load user profile');
      }
      
      const user = await response.json();
      
      // Update profile picture display
      const profilePictureDisplay = document.getElementById('profilePictureDisplay');
      if (user.profile_picture) {
        profilePictureDisplay.src = user.profile_picture;
      } else {
        profilePictureDisplay.src = '/static/uploads/profile_pictures/default-avatar.png';
      }
      
      // Show/hide delete button based on whether profile picture exists
      const deleteBtn = document.getElementById('deleteProfilePictureBtn');
      if (user.profile_picture) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }
    } catch (err) {
      console.error('Error loading user profile:', err);
      showError('Failed to load user profile');
    }
  }

  // Handle profile picture upload
  const profilePictureInput = document.getElementById('profilePictureInput');
  profilePictureInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    // Validate file size (5MB)
    if (file.size > 5 * 1024 * 1024) {
      showError('File size exceeds 5MB limit');
      e.target.value = '';
      return;
    }
    
    // Validate file type
    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
    if (!allowedTypes.includes(file.type)) {
      showError('Invalid file type. Please upload a JPEG, PNG, GIF, or WebP image.');
      e.target.value = '';
      return;
    }
    
    // Show loading state
    const loadingDiv = document.getElementById('profilePictureLoading');
    loadingDiv.classList.remove('hidden');
    
    try {
      const formData = new FormData();
      formData.append('file', file);
      
      const response = await fetch('/users/profile-picture', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`
        },
        body: formData
      });
      
      if (!response.ok) {
        if (response.status === 401) {
          localStorage.clear();
          window.location.href = '/login';
          return;
        }
        const errorData = await response.json();
        throw new Error(errorData.detail || 'Failed to upload profile picture');
      }
      
      const user = await response.json();
      
      // Update profile picture display
      const profilePictureDisplay = document.getElementById('profilePictureDisplay');
      profilePictureDisplay.src = user.profile_picture;
      
      // Show delete button
      document.getElementById('deleteProfilePictureBtn').classList.remove('hidden');
      
      showSuccess('Profile picture uploaded successfully!');
      
      // Update profile picture in layout if it exists
      const layoutProfilePicture = document.getElementById('layoutProfilePicture');
      if (layoutProfilePicture) {
        layoutProfilePicture.src = user.profile_picture;
      }
      
      // Update localStorage
      if (user.profile_picture) {
        localStorage.setItem('profile_picture', user.profile_picture);
      }
      
    } catch (err) {
      showError(err.message || 'Error uploading profile picture');
    } finally {
      loadingDiv.classList.add('hidden');
      e.target.value = '';
    }
  });
  
  // Handle profile picture deletion
  const deleteProfilePictureBtn = document.getElementById('deleteProfilePictureBtn');
  deleteProfilePictureBtn.addEventListener('click', async () => {
    if (!confirm('Are you sure you want to remove your profile picture?')) {
      return;
    }
    
    const loadingDiv = document.getElementById('profilePictureLoading');
    loadingDiv.classList.remove('hidden');
    deleteProfilePictureBtn.disabled = true;
    
    try {
      const response = await fetch('/users/profile-picture', {
        method: 'DELETE',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });
      
      if (!response.ok) {
        if (response.status === 401) {
          localStorage.clear();
          window.location.href = '/login';
          return;
        }
        const errorData = await response.json();
        throw new Error(errorData.detail || 'Failed to delete profile picture');
      }
      
      const user = await response.json();
      
      // Update profile picture display to default
      const profilePictureDisplay = document.getElementById('profilePictureDisplay');
      profilePictureDisplay.src = '/static/uploads/profile_pictures/default-avatar.png';
      
      // Hide delete button
      deleteProfilePictureBtn.classList.add('hidden');
      
      showSuccess('Profile picture removed successfully!');
      
      // Update profile picture in layout if it exists
      const layoutProfilePicture = document.getElementById('layoutProfilePicture');
      if (layoutProfilePicture) {
        layoutProfilePicture.src = '/static/uploads/profile_pictures/default-avatar.png';
      }
      
      // Update localStorage
      localStorage.removeItem('profile_picture');
      
    } catch (err) {
      showError(err.message || 'Error removing profile picture');
    } finally {
      loadingDiv.classList.add('hidden');
      deleteProfilePictureBtn.disabled = false;
    }
  });

  // Initial load
  loadUserProfile();
});
</script>
{% endblock %}
